hardware:
  chip: gpiochip0
  shift_register:
    data: 17
    clock: 27
    latch: 22
    bit_order:
      - N_red
      - N_yellow
      - N_green
      - E_red
      - E_yellow
      - E_green
      - S_red
      - S_yellow
      - S_green
      - W_red
      - W_yellow
      - W_green
      - free
      - free
      - free
      - free
  sensors:
    north: [5, 6, 13]
    east: [19, 26, 12]
    south: [16, 20, 21]
    west: [23, 24, 25]
  mode_switch: 4
  reset_button: 18
  debounce_ms: 15

timing:
  yellow_ms: 3000
  red_yellow_ms: 1000
  all_red_ms: 2000
  base_green_ms: 5000
  max_green_ms: 20000
  follow_ms: 2000
  extension_ms: 3000

fixed:
  green_ms: 15000

adaptive:
  demand_alpha: 0.3

queue_mapping:
  0: 0
  1: 1
  2: 3
  3: 6

logging:
  dir: /var/log/ampel
  state_interval_ms: 1000
  buffer: 4096
