hardware:
  chip: gpiochip0
  # Je Ampelkopf Rot, Gelb, Gruen direkt an einer GPIO-Leitung.
  lamps:
    north: [17, 27, 22]
    east: [5, 6, 13]
    south: [19, 26, 12]
    west: [16, 20, 21]
  # Je Zufahrt der Reed-Kontakt an der Haltelinie.
  sensors:
    north: 23
    east: 24
    south: 25
    west: 3
  power_switch: 4
  fault_switch: 18
  debounce_ms: 15

timing:
  yellow_ms: 3000
  red_yellow_ms: 1000
  all_red_ms: 2000
  base_green_ms: 5000
  max_green_ms: 20000
  follow_ms: 2000
  extension_ms: 3000


api:
  enabled: true
  address: ":8080"

display:
  enabled: true
  spi: /dev/spidev0.0
  speed_hz: 24000000
  dc: 2
  reset: -1
  rotation: quer
