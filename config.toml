[lamps]
# SPI0 (Pin 19): an SPI1 (Pin 38) reagieren die WS2812-Sticks am Pi 3 nicht
spi = "/dev/spidev0.0"
speed_hz = 2400000
brightness = 60
# je Farbe zwei LEDs, Rot oben (Pixel 7 sitzt am Stick oben)
pixels = [[7, 6], [4, 3], [1, 0]]

[sensors]
north = 23
east = 24
south = 25
west = 3

[switches]
power = 4
fault = 27

[display]
# aus, bis das Display an SPI1 umgezogen ist (SPI0 belegen jetzt die Lampen)
enabled = false
spi = "/dev/spidev0.0"
speed_hz = 24000000
dc = 2
rotation = "quer"

[api]
enabled = true
socket = "/run/ampel/ampel.sock"

[timing]
yellow = 3.0
all_red = 2.0
red_yellow = 1.0
base_green = 5.0
max_green = 20.0
follow = 2.0
extension = 3.0
